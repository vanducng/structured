[package]
name = "structured"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Unofficial CLI and TUI for the Structured day planner"
repository = "https://github.com/vanducng/structured"
readme = "README.md"
keywords = ["cli", "tui", "tasks", "planner"]
categories = ["command-line-utilities"]
authors = ["Duc Nguyen <me@vanducng.dev>"]
publish = false

[[bin]]
name = "structured"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
clap = { version = "4.5", features = ["cargo", "derive", "wrap_help"] }
clap_complete = "4.5"
iana-time-zone = "0.1"
rand = "0.8"
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tui-input = "0.15"
unicode-width = "0.2"
urlencoding = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[profile.release]
strip = true
lto = "thin"
